server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: black-coat-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blackcoat}
    username: ${SPRING_DATASOURCE_USERNAME:blackcoat}
    password: ${SPRING_DATASOURCE_PASSWORD:blackcoat_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Security & JWT Configuration
blackcoat:
  jwt:
    secret: ${BLACKCOAT_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: 900000       # 15 minutes
    refresh-token-expiration-ms: 604800000   # 7 days
  quota:
    daily-limit: 10
    monthly-limit: 100
  corpus:
    active-version: ${BLACKCOAT_CORPUS_VERSION:v1.0}
    similarity-threshold: 0.65
    top-k-results: 6

  # Free LLM Provider Fallback Chain: Gemini -> Groq -> Ollama
  llm:
    gemini:
      enabled: ${LLM_GEMINI_ENABLED:true}
      api-key: ${GEMINI_API_KEY:}
      model: ${LLM_GEMINI_MODEL:gemini-3.8-flash}
      base-url: ${LLM_GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-ms: 15000
    groq:
      enabled: ${LLM_GROQ_ENABLED:true}
      api-key: ${GROQ_API_KEY:}
      model: ${LLM_GROQ_MODEL:qwen/qwen3.8-27b}
      base-url: ${LLM_GROQ_BASE_URL:https://api.groq.com/openai/v1}
      timeout-ms: 10000
    chain:
      - name: gemini
        enabled: ${LLM_GEMINI_ENABLED:true}
        api-key: ${GEMINI_API_KEY:}
        model: ${LLM_GEMINI_MODEL:gemini-3.8-flash}
        base-url: https://generativelanguage.googleapis.com/v1beta
        timeout-ms: 15000
      - name: groq
        enabled: ${LLM_GROQ_ENABLED:true}
        api-key: ${GROQ_API_KEY:}
        model: ${LLM_GROQ_MODEL:qwen/qwen3.8-27b}
        base-url: https://api.groq.com/openai/v1
        timeout-ms: 10000
      - name: ollama
        enabled: ${LLM_OLLAMA_ENABLED:false}
        model: llama3.2:3b
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        timeout-ms: 12000

# Resilience4j Circuit Breaker & Retry Configuration
resilience4j:
  circuitbreaker:
    instances:
      geminiLlm:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      groqLlm:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      ollamaLlm:
        sliding-window-size: 5
        minimum-number-of-calls: 2
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
