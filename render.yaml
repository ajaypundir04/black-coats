# ==============================================================================
# Render Blueprint Specification for Black-Coat
# Zero-cost deployment: Free Web Service + Free Static Site
# ==============================================================================
services:
  # 1. Backend API (Modular Monolith)
  - type: web
    name: black-coat-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        placeholder: "jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require"
      - key: SPRING_DATASOURCE_USERNAME
        placeholder: "postgres.<project-ref>"
      - key: SPRING_DATASOURCE_PASSWORD
        placeholder: "your-db-password"
      - key: BLACKCOAT_JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        placeholder: "your-google-gemini-free-api-key"
      - key: GROQ_API_KEY
        placeholder: "your-groq-free-api-key"
      - key: LLM_OLLAMA_ENABLED
        value: "false"
      - key: BLACKCOAT_CORPUS_VERSION
        value: "v1.0"

  # 2. Frontend Web Application (Angular Static Site)
  - type: web
    name: black-coat-web
    runtime: static
    buildCommand: "cd black-coat-web && npm install && npm run build"
    publishDir: ./black-coat-web/dist/black-coat-web
    plan: free
    region: oregon
    envVars:
      - key: API_URL
        value: "https://black-coats.onrender.com"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
