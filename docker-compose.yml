services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: black-coat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: blackcoat
      POSTGRES_USER: blackcoat
      POSTGRES_PASSWORD: blackcoat_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackcoat -d blackcoat"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: black-coat-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  postgres_data:
  ollama_models:
